services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mooping-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mooping
      POSTGRES_USER: mooping
      POSTGRES_PASSWORD: mooping
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mooping-data:/var/lib/postgresql/data

volumes:
  mooping-data:
