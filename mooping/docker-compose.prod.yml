# MooPing en producción: HTTPS (Caddy) + gunicorn, sin DEBUG y sin puertos internos expuestos.
#   cp .env.prod.example .env.prod   # completar las claves
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Desde la red solo se ven Caddy (80/443) y la telemetría de la Pi (4001, con TELEMETRY_API_KEY).
# La base, el backend y el frontend quedan en la red interna de Docker.

name: mooping-prod

x-backend-env: &backend-env
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: mooping
  PGUSER: mooping
  PGPASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env.prod}
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Falta DJANGO_SECRET_KEY en .env.prod}
  DJANGO_ALLOWED_HOSTS: ${SITE_HOST:?Falta SITE_HOST en .env.prod}
  CORS_ALLOWED_ORIGINS: https://${SITE_HOST}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:?Falta TELEMETRY_API_KEY en .env.prod}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
  SUPPORT_PHONE: ${SUPPORT_PHONE:-}
  SUPPORT_HOURS: ${SUPPORT_HOURS:-}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  PYTHONUNBUFFERED: "1"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: mooping
      POSTGRES_USER: mooping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env.prod}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mooping -d mooping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env
    volumes:
      - media:/app/media          # fotos de los animales
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30 --access-logfile -"

  telemetry:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env
    ports:
      - "${TELEMETRY_PORT:-4001}:4001"   # la Pi tiene que llegar; exige TELEMETRY_API_KEY
    command: python manage.py telemetry_tcp

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_HOST}
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data          # certificados

volumes:
  db-data:
  media:
  caddy-data:
