# MooPing - entorno completo: base de datos + backend + frontend.
#   docker compose up -d --build
# La primera vez crea la base con db/schema.sql y corre las migraciones de Django.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mooping-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mooping
      POSTGRES_USER: mooping
      POSTGRES_PASSWORD: mooping
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mooping-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mooping -d mooping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: mooping-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: mooping
      PGUSER: mooping
      PGPASSWORD: mooping
      DJANGO_DEBUG: "true"
      # "*" para poder entrar desde el celular por la IP de la red (solo dev)
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app        # cambios en el código se recargan solos
      - /app/.venv            # no pisar con el .venv de Windows
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Receives the JSON that the Raspberry Pi (lora_receiver.c) sends over TCP.
  # On the Pi set BACKEND_IP to this computer's IP and keep BACKEND_PORT 4001.
  telemetry:
    build: ./backend
    container_name: mooping-telemetry
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: mooping
      PGUSER: mooping
      PGPASSWORD: mooping
      PYTHONUNBUFFERED: "1"
    ports:
      - "${TELEMETRY_PORT:-4001}:4001"
    volumes:
      - ./backend:/app
      - /app/.venv
    command: python manage.py telemetry_tcp

  # Frontend React (Vite). /api se proxyea al servicio backend.
  frontend:
    image: node:22-alpine
    container_name: mooping-frontend
    restart: unless-stopped
    depends_on:
      - backend
    working_dir: /app
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app       # cambios en el código se recargan solos
      - /app/node_modules     # no pisar con el node_modules de Windows
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  mooping-data:
